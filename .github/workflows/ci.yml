name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"
  DATABASE_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_test"
  DIRECT_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_test"

jobs:
  # ============================================================
  # Lint & Type Check
  # ============================================================
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

  # ============================================================
  # Unit & Integration Tests
  # ============================================================
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookflow
          POSTGRES_PASSWORD: bookflow
          POSTGRES_DB: bookflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_test"
      DIRECT_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_test"
      NEXTAUTH_SECRET: "test-secret-at-least-32-characters-long"
      ENCRYPTION_KEY: "test-encryption-key-32chars-long!!"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: packages/database

      - name: Run migrations
        run: npx prisma migrate deploy
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Run unit tests
        run: npm run test -- --coverage
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}
          NEXTAUTH_SECRET: ${{ env.NEXTAUTH_SECRET }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: apps/web/coverage
          flags: unit
          fail_ci_if_error: false

  # ============================================================
  # Build Verification
  # ============================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]

    env:
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "build-test-secret-at-least-32-chars"
      DATABASE_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_build"
      DIRECT_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_build"
      NEXTAUTH_URL: "http://localhost:3000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: packages/database

      - name: Build application
        run: npm run build
        working-directory: apps/web
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next
          retention-days: 7

  # ============================================================
  # E2E Tests (only on main branch or explicitly requested)
  # ============================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'run-e2e')

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bookflow
          POSTGRES_PASSWORD: bookflow
          POSTGRES_DB: bookflow_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_e2e"
      DIRECT_URL: "postgresql://bookflow:bookflow@localhost:5432/bookflow_e2e"
      NEXTAUTH_SECRET: "e2e-test-secret-at-least-32-chars-long"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      PLAYWRIGHT_BASE_URL: "http://localhost:3000"
      ENCRYPTION_KEY: "e2e-encryption-key-32chars-long!!!"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: packages/database

      - name: Run migrations and seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed
        working-directory: packages/database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          DIRECT_URL: ${{ env.DIRECT_URL }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next

      - name: Start server
        run: npx next start &
        working-directory: apps/web
        env:
          PORT: "3000"

      - name: Wait for server
        run: npx wait-on http://localhost:3000/api/health --timeout 30000

      - name: Run E2E tests
        run: npx playwright test
        working-directory: apps/web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 30

  # ============================================================
  # Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
