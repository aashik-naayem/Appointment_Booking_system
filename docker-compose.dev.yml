# ============================================================
# BookFlow — Development database only
# Run: docker compose -f docker-compose.dev.yml up -d
# Then: npm run dev (in apps/web)
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookflow -d bookflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bookflow-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
